<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position:fixed;top:0;left:0;margin:0;padding:0;">
  <foreignObject x="0" y="0" width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Yet Another Proxy</title>
        <style>
          body { background: #111; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
          #browser-toolbar { background: #18181b; border-bottom: 1px solid #333; }
          #tab-container { display: flex; align-items: center; padding: 4px; gap: 4px; background: #09090b; }
          #tabs-list { display: flex; gap: 4px; overflow-x: auto; flex: 1; }
          .browser-tab { display: flex; align-items: center; gap: 6px; background: #18181b; color: #aaa; padding: 4px 10px; font-size: 12px; cursor: pointer; border-radius: 4px; }
          .browser-tab.active { background: #27272a; color: #fff; }
          .tab-close { background: none; border: none; color: #777; cursor: pointer; font-size: 10px; }
          #new-tab-btn, #nav-bar button { background: none; border: none; color: #fff; cursor: pointer; padding: 4px 8px; }
          #nav-bar { display: flex; align-items: center; padding: 6px; gap: 6px; }
          #sj-form { flex: 1; display: flex; }
          #sj-address { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 6px 10px; border-radius: 4px; outline: none; }
          #home-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; }
          #viewport-container { flex: 1; position: relative; display: none; background: #fff; }
          .proxy-frame-instance { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; }
          .proxy-frame-instance.active { display: block; }
        </style>
      </head>
      <body>
        <div id="browser-toolbar">
          <div id="tab-container">
            <div id="tabs-list"></div>
            <button id="new-tab-btn" title="New Tab">+</button>
          </div>
          <div id="nav-bar">
            <button id="back-btn" title="Back">&larr;</button>
            <button id="forward-btn" title="Forward">&rarr;</button>
            <button id="reload-btn" title="Reload">&#8635;</button>
            <form id="sj-form">
              <input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden" />
              <input id="sj-address" type="text" placeholder="Search the web or type a URL..." autocomplete="off" />
            </form>
          </div>
        </div>

        <div id="home-view">
          <img src="sj.png" alt="Logo" style="height: 100px;" />
          <h1>Scramjet | YEP v1</h1>
          <p>Experimental web proxy browser.</p>
          <p id="sj-error" style="color: #ff6666;"></p>
          <pre id="sj-error-code" style="font-size: 11px;"></pre>
        </div>

        <div id="viewport-container"></div>
      </body>
    </html>
  </foreignObject>

  <script><![CDATA[
    // ForeignObject XHTML Namespace Shim
    (function() {
      var ns = "http://www.w3.org/1999/xhtml";
      var body = document.querySelector("body");
      var head = document.createElementNS(ns, "head");
      body.prepend(head);
      Object.defineProperty(document, "head", { get: function() { return head; }, configurable: true });
      Object.defineProperty(document, "body", { get: function() { return body; }, configurable: true });
      var origCreate = document.createElement.bind(document);
      document.createElement = function(tag, opts) {
        return document.createElementNS(ns, tag, opts);
      };
    })();

    const BACKEND = "http://yep-v1.duckdns.org:8080";

    function loadScript(src, cb) {
      var s = document.createElement("script");
      s.src = src;
      s.async = false;
      if (cb) s.onload = cb;
      document.head.appendChild(s);
    }

    loadScript(BACKEND + "/scram/scramjet.all.js", function() {
      loadScript(BACKEND + "/baremux/index.js", function() {
        loadScript("search.js", function() {
          loadScript("index.js", function() {
            console.log("Barebones YEP v1 loaded successfully!");
          });
        });
      });
    });
  ]]></script>
</svg>
