<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position: fixed; top: 0; left: 0; margin: 0; padding: 0; overflow: hidden;">
  <foreignObject x="0" y="0" width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no" />
        <title>Yet Another Proxy (Scramjet v2)</title>
        <style>
          @import url("https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;1,300;1,400&amp;display=swap");

          * { box-sizing: border-box; }
          body {
              font-family: "Roboto", Arial, Helvetica, sans-serif;
              margin: 0;
              background: #121214;
              color: #e1e1e6;
              display: flex;
              flex-direction: column;
              height: 100vh;
              overflow: hidden;
          }
          #browser-toolbar {
              display: flex;
              flex-direction: column;
              background-color: #18181b;
              border-bottom: 1px solid #27272a;
              user-select: none;
              z-index: 100;
              flex-shrink: 0;
          }
          #tab-container {
              display: flex;
              align-items: center;
              height: 38px;
              padding: 0 8px;
              gap: 6px;
              background-color: #111113;
              width: 100%;
          }
          #tabs-list {
              display: flex;
              gap: 4px;
              overflow-x: auto;
              flex: 1;
              height: 100%;
              align-items: flex-end;
              scrollbar-width: none;
          }
          #tabs-list::-webkit-scrollbar { display: none; }
          
          .browser-tab {
              display: flex;
              align-items: center;
              gap: 8px;
              background-color: #18181b;
              color: #a1a1aa;
              padding: 0 12px;
              height: 32px;
              border-radius: 6px 6px 0 0;
              font-size: 13px;
              cursor: pointer;
              max-width: 180px;
              min-width: 120px;
              border: 1px solid #27272a;
              border-bottom: none;
          }
          .browser-tab.active {
              background-color: #121214;
              color: #f4f4f5;
              border-color: #3f3f46;
              border-bottom: 2px solid #121214;
          }
          .tab-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
          .tab-close { background: transparent; border: none; color: #71717a; cursor: pointer; border-radius: 50%; width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
          .tab-close:hover { background-color: #3f3f46; color: #fff; }
          
          #new-tab-btn {
              background: transparent;
              border: none;
              color: #a1a1aa;
              width: 28px;
              height: 28px;
              border-radius: 6px;
              cursor: pointer;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 16px;
              flex-shrink: 0;
          }
          #new-tab-btn:hover { background-color: #27272a; color: #fff; }

          #nav-bar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background-color: #18181b; }
          #nav-bar button { background: transparent; border: none; color: #a1a1aa; width: 32px; height: 32px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
          #nav-bar button:hover { background-color: #27272a; color: #f4f4f5; }
          
          #sj-form { flex: 1; display: flex; }
          #address-wrapper { flex: 1; display: flex; align-items: center; background-color: #09090b; border: 1px solid #27272a; border-radius: 6px; padding: 0 10px; height: 36px; gap: 8px; }
          #address-wrapper:focus-within { border-color: #6366f1; }
          .security-icon { color: #10b981; font-size: 11px; }
          #sj-address { flex: 1; background: none; border: none; color: #fff; font-size: 14px; outline: none; font-family: inherit; padding: 0; margin: 0; width: 100%; }
          
          #home-view { flex: 1; display: flex; flex-direction: column; align-items: center; overflow-y: auto; padding-bottom: 40px; }
          #viewport-container { flex: 1; position: relative; background-color: #fff; display: none; width: 100%; height: 100%; }
          
          .proxy-frame-instance { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; }
          .proxy-frame-instance.active { display: block; }
          
          .flex-center { display: flex; justify-content: center; }
          .header-center { align-items: center; flex-direction: column; margin-top: 8vh; }
          .left-margin { margin: 0px 16px; }
          .logo { height: 20vh; }
          .logo-wrapper h1 { color: white; margin-top: 15px; }
          .desc p { width: 560px; color: rgba(253, 253, 253, 0.514); text-align: center; }
          
          #sj-error { color: #ff6666 !important; white-space: pre-wrap; }
          #sj-error-code { font-size: 12px; color: #fff; font-family: "Courier New", Courier, monospace; }
          
          footer { margin: 10px 16px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: rgba(255, 255, 255, 0.5); flex-shrink: 0; }
          footer div { display: flex; gap: 15px; }
          footer a { text-decoration: none; color: rgba(255, 255, 255, 0.7); }
          footer a:hover { text-decoration: underline; color: #fff; }
        </style>
      </head>
      <body>
        <div id="browser-toolbar">
            <div id="tab-container">
                <div id="tabs-list"></div>
                <button id="new-tab-btn" title="New Tab">+</button>
            </div>
            <div id="nav-bar">
                <button id="back-btn" title="Back">←</button>
                <button id="forward-btn" title="Forward">→</button>
                <button id="reload-btn" title="Reload">⟳</button>
                <form id="sj-form">
                    <input id="sj-search-engine" value="https://www.google.com/search?q=%s" type="hidden" />
                    <div id="address-wrapper">
                        <span class="security-icon">🔒</span>
                        <input id="sj-address" type="text" placeholder="Search the web or type a URL..." autocomplete="off" spellcheck="false" />
                    </div>
                </form>
            </div>
        </div>

        <div id="home-view" class="view-container">
            <div title="Scramjet Logo" class="flex-center logo-wrapper header-center">
                <img class="logo" src="sj.png" alt="Scramjet" />
                <h1>Scramjet | MW</h1>
            </div>
            <div class="flex-center desc left-margin">
                <p>Scramjet is an experimental interception based web proxy designed to evade internet censorship and arbitrary browser restrictions.</p>
            </div>
            <div class="desc left-margin error-box">
                <p id="sj-error"></p>
                <pre id="sj-error-code"></pre>
            </div>
        </div>

        <div id="viewport-container"></div>

        <footer>
            <div>
                <a href="https://github.com/MercuryWorkshop">Mercury Workshop</a>
                <a href="https://github.com/MercuryWorkshop/Scramjet-Demo">GitHub</a>
            </div>
            <div><span>Scramjet &#169; MW 2025</span></div>
        </footer>
      </body>
    </html>
  </foreignObject>

  <script><![CDATA[
    (function() {
      var ns = "http://www.w3.org/1999/xhtml";
      var body = document.querySelector("body");
      var head = document.createElementNS(ns, "head");
      body.prepend(head);
      Object.defineProperty(document, "head", { get: function() { return head; }, configurable: true });
      Object.defineProperty(document, "body", { get: function() { return body; }, configurable: true });
      var origCreate = document.createElement.bind(document);
      document.createElement = function(tag, opts) {
        return document.createElementNS(ns, tag, opts);
      };
    })();

    self.__yepBase = function() {
      var n = location.pathname, a = n.indexOf("/internal/");
      return -1 !== a ? n.substring(0, a + 1) : new URL("./", location.href).pathname;
    }();

    const BACKEND = "https://yep-v1.duckdns.org";
    const base = self.__yepBase;

    (function() {
      var d = document;
      var b = d.querySelector("body");
      var ns = "http://www.w3.org/1999/xhtml";

      // Sequential loader using namespace-aware createElementNS and body append
      var srcs = [
        BACKEND + "/scram/scramjet.all.js",
        BACKEND + "/baremux/index.js",
        base + "search.js",
        base + "index.js"
      ];

      var pending = srcs.length;
      function done() {
        if (--pending === 0) {
          console.log("[YEP] All backend & local scripts loaded sequentially.");
          d.dispatchEvent(new Event("DOMContentLoaded"));
          if (typeof createNewTab === "function" && document.querySelectorAll(".browser-tab").length === 0) {
            createNewTab();
          }
        }
      }

      srcs.forEach(function(u) {
        var s = d.createElementNS(ns, "script");
        s.setAttribute("src", u);
        s.async = false;
        s.onload = done;
        s.onerror = function() {
          console.error("[YEP] Failed to load script:", u);
          done();
        };
        b.appendChild(s);
      });
    })();
  ]]></script>
</svg>
